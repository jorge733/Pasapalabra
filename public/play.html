<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0b1f">
<title>Letramanía · Control</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body{min-height:100dvh;font-size:18px}
  #top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:4px solid var(--team,var(--pend))}
  #top b{font-weight:900}
  #v{padding:20px 16px;display:flex;flex-direction:column;gap:14px;min-height:calc(100dvh - 60px)}
  h1{font-size:28px;margin:0;font-weight:900;text-align:center}
  h2{font-size:22px;margin:0;font-weight:900;text-align:center}
  p{margin:0;color:var(--muted);text-align:center;line-height:1.4}
  .in{width:100%;padding:16px;font-size:22px;border-radius:14px;border:3px solid var(--pend);background:var(--panel);color:var(--ink);outline:none;text-align:center}
  .in:focus{border-color:var(--team,var(--A))}
  .btn{width:100%;padding:18px;font-size:22px;font-weight:900;background:var(--team,var(--A));color:#111}
  .btn.sec{background:var(--panel);color:var(--ink)}
  .btn:active{transform:scale(.97)}
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .teams button{padding:22px 8px;font-size:18px;font-weight:900;color:#111;background:var(--team);opacity:.45}
  .teams button.sel{opacity:1;outline:4px solid #fff}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1}
  .opts button{font-size:20px;font-weight:900;padding:12px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .opts .k{font-size:32px}
  .o0{background:var(--o0)}.o1{background:var(--o1)}.o2{background:var(--o2)}.o3{background:var(--o3)}
  .buzz{flex:1;min-height:45vh;border-radius:50%;aspect-ratio:1;margin:auto;width:min(80vw,340px);font-size:34px;font-weight:900;background:var(--team);color:#111;box-shadow:0 10px 0 rgba(0,0,0,.35)}
  .buzz:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(0,0,0,.35)}
  .letra{font-size:80px;font-weight:900;text-align:center;line-height:1;color:var(--team)}
  .reloj{font-size:44px;font-weight:900;text-align:center}
  .res{font-size:30px;font-weight:900;text-align:center;padding:22px;border-radius:16px}
  .ok{background:var(--ok)} .ko{background:var(--ko)}
  .row{display:grid;grid-template-columns:2fr 1fr;gap:10px}
  .grow{flex:1}
</style>
</head><body>
<div id="top" class="hidden"><span>Letra<b style="color:var(--B)">manía</b></span><b id="relojM" style="font-size:22px"></b><span id="yo"></span></div>
<div id="v"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const seg = (ms) => Math.max(0, Math.ceil(ms / 1000));
const vibra = (p) => navigator.vibrate && navigator.vibrate(p);
let me = null, S = null, viewKey = '', enviado = {};
try { me = JSON.parse(localStorage.getItem('letramania-yo')); } catch (e) {}

const sock = io();
sock.on('connect', () => { if (me) sock.emit('join', me); });
sock.on('me', (m) => { me = m; try { localStorage.setItem('letramania-yo', JSON.stringify(m)); } catch (e) {} });
sock.on('state', (s, ev) => {
  S = s;
  if (me && ev === 'turno' && s.phase === 'rueda' && s.rueda.turno === me.team) vibra([80, 60, 80]);
  render();
});

function join(team) {
  const name = $('#nombre').value.trim();
  if (!name) { $('#nombre').focus(); return; }
  me = { name, team };
  sock.emit('join', me);
  render();
}
function equipoNombre(t) { return S ? S.teams[t].name : t; }

// Cada vista tiene una "clave": solo se redibuja entera cuando cambia, para no borrar lo que estás escribiendo.
function vista() {
  if (!me) return { key: 'join', html: () => `
    <h1>¡Bienvenido!</h1><p>Escribe tu nombre y elige equipo</p>
    <input id="nombre" class="in" maxlength="16" placeholder="Tu nombre" autocomplete="off">
    <div class="teams"><button class="A" onclick="join('A')">${esc(equipoNombre('A'))}</button><button class="B" onclick="join('B')">${esc(equipoNombre('B'))}</button></div>` };
  if (!S) return { key: 'cargando', html: () => '<p>Conectando…</p>' };
  const mt = me.team, otro = mt === 'A' ? 'B' : 'A';
  switch (S.phase) {
    case 'lobby': return { key: 'lobby' + mt + S.teams[mt].name, html: () => `
      <div class="grow"></div><h1>¡Estás dentro!</h1><p>Mira la tele. La partida empieza cuando el presentador lo diga.</p>
      <div class="grow"></div><button class="btn sec" onclick="cambiar()">Cambiar de equipo</button>
      <button class="btn sec" onclick="salir()">Cambiar nombre</button>` };
    case 'intro': return { key: 'intro' + S.intro.titulo, html: () => `
      <div class="grow"></div><h1>${esc(S.intro.titulo)}</h1><p>${esc(S.intro.texto)}</p><div class="grow"></div>` };
    case 'quiz': {
      const q = S.quiz;
      if (S.modo === 'presentador') {
        if (q.stage === 'reveal') return { key: 'pqr' + q.n, html: () => `<div class="grow"></div><div class="res ${q.gana[mt] ? 'ok' : 'ko'}">${q.gana[mt] ? '¡Correcto! +' + q.gana[mt] + ' s' : 'Sin puntos esta vez'}</div><div class="grow"></div>` };
        if (q.buzz && q.buzz.team === mt) return { key: 'pqm' + q.n, html: () => `<div class="grow"></div><h1>🔔 ¡Les toca!</h1><h2>Digan la respuesta en voz alta</h2><div class="grow"></div>` };
        if (q.buzz) return { key: 'pqo' + q.n, html: () => `<div class="grow"></div><h2>${esc(equipoNombre(q.buzz.team))} está respondiendo…</h2><div class="grow"></div>` };
        if (q.bloqueado[mt]) return { key: 'pql' + q.n, html: () => `<div class="grow"></div><h2>Tu equipo falló esta pregunta</h2><p>Espera a la siguiente</p><div class="grow"></div>` };
        return { key: 'pqb' + q.n, html: () => `<p>Pregunta ${q.n}/${q.total} · escucha al presentador</p><button class="buzz" onclick="sock.emit('buzz');vibra(60)">¡La sé!</button>` };
      }
      if (q.stage === 'reveal') {
        const r = q.resp[mt];
        return { key: 'qr' + q.n, html: () => r ? `<div class="grow"></div><div class="res ${r.ok ? 'ok' : 'ko'}">${r.ok ? '¡Correcto! +' + q.gana[mt] + ' s' : 'Incorrecto'}</div><div class="grow"></div>`
                                               : '<div class="grow"></div><div class="res ko">Sin respuesta</div><div class="grow"></div>' };
      }
      if (q.respondido[mt]) return { key: 'qw' + q.n, html: () => `<div class="grow"></div><h2>Respuesta de tu equipo enviada</h2><p>Esperando…</p><div class="grow"></div>` };
      return { key: 'qa' + q.n, html: () => `<p>Pregunta ${q.n}/${q.total} · mira la tele</p><div class="opts">${q.opciones.map((o, k) =>
        `<button class="o${k}" onclick="sock.emit('quiz',${k});vibra(30)"><span class="k">${'ABCD'[k]}</span>${esc(o)}</button>`).join('')}</div>` };
    }
    case 'oculta': {
      const o = S.oculta;
      if (o.stage === 'reveal') return { key: 'or' + o.n, html: () => `<div class="grow"></div>` + (o.ganador
        ? `<div class="res ${o.ganador.team === mt ? 'ok' : 'ko'}">${o.ganador.team === mt ? '¡Bien! +' + o.ganador.seg + ' s' : 'Acertó ' + esc(equipoNombre(o.ganador.team))}</div>`
        : '<h2>Nadie la acertó</h2>') + `<div class="grow"></div>` };
      if (o.buzz && o.buzz.team === mt && S.modo === 'presentador') return { key: 'opm' + o.n, html: () => `<div class="grow"></div><h1>🔔 ¡Les toca!</h1><h2>Digan la palabra en voz alta</h2><div class="grow"></div>` };
      if (o.buzz && o.buzz.team === mt) return { key: 'oa' + o.n, html: () => `
        <h2>¡Escribe la palabra!</h2><p>${esc(o.pista)}</p><div class="reloj" id="cuenta"></div>
        <form onsubmit="event.preventDefault();sock.emit('oculta',$('#resp').value)"><input id="resp" class="in" autocomplete="off" autocapitalize="characters" autofocus>
        <button class="btn" style="margin-top:12px">Enviar</button></form>`, after: () => $('#resp').focus(),
        tick: () => { const c = $('#cuenta'); if (c) c.textContent = seg(o.buzz.rem); } };
      if (o.buzz) return { key: 'ob' + o.n + o.buzz.team, html: () => `<div class="grow"></div><h2>${esc(equipoNombre(o.buzz.team))} está respondiendo…</h2><div class="grow"></div>` };
      if (o.bloqueado[mt]) return { key: 'ol' + o.n, html: () => `<div class="grow"></div><h2>Tu equipo falló esta palabra</h2><p>Espera a la siguiente</p><div class="grow"></div>` };
      return { key: 'op' + o.n, html: () => `<p>Palabra ${o.n}/${o.total}${o.pista ? ' · ' + esc(o.pista) : ' · escucha la pista'}</p>
        <button class="buzz" onclick="sock.emit('buzz');vibra(60)">¡La sé!</button>` };
    }
    case 'vf': {
      const v = S.vf;
      if (v.stage === 'reveal') return { key: 'vr' + v.n, html: () => `<div class="grow"></div><div class="res ${v.gana[mt] ? 'ok' : 'ko'}">${v.gana[mt] ? '¡Correcto! +3 s' : 'Era ' + (v.verdadero ? 'VERDADERO' : 'FALSO')}</div><div class="grow"></div>` };
      if (v.respondido[mt]) return { key: 'vw' + v.n, html: () => `<div class="grow"></div><h2>Respuesta de tu equipo enviada</h2><p>Esperando…</p><div class="grow"></div>` };
      return { key: 'va' + v.n, html: () => `<p>Afirmación ${v.n}/${v.total} · ${v.texto ? 'mira la tele' : 'escucha al presentador'}</p>
        <div class="opts" style="grid-template-columns:1fr">
          <button style="background:var(--ok);font-size:30px" onclick="sock.emit('vf',true);vibra(30)">✔ Verdadero</button>
          <button style="background:var(--ko);font-size:30px" onclick="sock.emit('vf',false);vibra(30)">✘ Falso</button></div>` };
    }
    case 'anagrama': case 'quiensoy': case 'refran': {
      const p = S.p, k = p.kind + p.n;
      if (p.stage === 'reveal') return { key: 'pr' + k, html: () => `<div class="grow"></div>` + (p.ganador
        ? `<div class="res ${p.ganador.team === mt ? 'ok' : 'ko'}">${p.ganador.team === mt ? '¡Bien! +' + p.ganador.seg + ' s' : 'Acertó ' + esc(equipoNombre(p.ganador.team))}</div>`
        : '<h2>Nadie lo acertó</h2>') + `<p style="margin-top:10px">${esc(p.respuesta)}</p><div class="grow"></div>` };
      if (p.buzz && p.buzz.team === mt && S.modo === 'presentador') return { key: 'pm' + k, html: () => `<div class="grow"></div><h1>🔔 ¡Les toca!</h1><h2>Digan la respuesta en voz alta</h2><div class="grow"></div>` };
      if (p.buzz && p.buzz.team === mt) return { key: 'pa' + k, html: () => `
        <h2>¡Escribe la respuesta!</h2><div class="reloj" id="cuenta"></div>
        <form onsubmit="event.preventDefault();sock.emit('oculta',$('#resp').value)"><input id="resp" class="in" autocomplete="off" autofocus>
        <button class="btn" style="margin-top:12px">Enviar</button></form>`, after: () => $('#resp').focus(),
        tick: () => { const c = $('#cuenta'); if (c) c.textContent = seg(p.buzz.rem); } };
      if (p.buzz) return { key: 'pb' + k + p.buzz.team, html: () => `<div class="grow"></div><h2>${esc(equipoNombre(p.buzz.team))} está respondiendo…</h2><div class="grow"></div>` };
      if (p.bloqueado[mt]) return { key: 'pl' + k, html: () => `<div class="grow"></div><h2>Tu equipo falló esta</h2><p>Espera a la siguiente</p><div class="grow"></div>` };
      return { key: 'pp' + k, html: () => `<p>${esc(p.titulo)} · ${p.n}/${p.total} · ${S.modo === 'presentador' ? 'escucha al presentador' : 'mira la tele'}</p>
        <button class="buzz" onclick="sock.emit('buzz');vibra(60)">¡La sé!</button>` };
    }
    case 'rueda': {
      const r = S.rueda;
      if (r.turno !== mt) return { key: 'rw' + r.turno, html: () => `<div class="grow"></div><h2>Turno de ${esc(equipoNombre(r.turno))}</h2>
        <p>Atentos: cuando fallen o pasen, les toca.</p><div class="reloj" id="cuenta"></div><p>segundos te quedan</p><div class="grow"></div>`,
        tick: () => { const c = $('#cuenta'); if (c) c.textContent = seg(r.eq[mt].tiempo); } };
      if (r.stage !== 'play' || !r.actual) {
        const u = r.ultimo || {};
        const msg = { fallo: ['ko', 'Incorrecto · era ' + esc((u.correcta || '').toUpperCase())], paso: ['', '¡Paso!'], tiempo: ['ko', '¡Sin tiempo!'], acierto: ['ok', '¡Correcto!'] }[u.tipo] || ['', '…'];
        return { key: 'rf' + (u.t || ''), html: () => `<div class="grow"></div><div class="res ${msg[0]}" style="${msg[0] ? '' : 'background:#6366f1'}">${msg[1]}</div><div class="grow"></div>` };
      }
      const a = r.actual;
      if (S.modo === 'presentador') return { key: 'rpp' + a.letra, html: () => `
        <div class="reloj" id="cuenta"></div>
        <p>${a.tipo === 'empieza' ? 'Empieza por' : 'Contiene la'}</p><div class="letra">${a.letra}</div>
        <h2>🎙️ Escucha la definición y responde en voz alta</h2><div class="grow"></div>
        <button class="btn sec" style="padding:26px" onclick="sock.emit('rueda',{paso:true});vibra(30)">Paso</button>`,
        tick: () => { const c = $('#cuenta'); if (c) c.textContent = seg(r.eq[mt].tiempo); } };
      return { key: 'rp' + a.letra, html: () => `
        <div class="reloj" id="cuenta"></div>
        <p>${a.tipo === 'empieza' ? 'Empieza por' : 'Contiene la'}</p><div class="letra">${a.letra}</div>
        <h2 style="font-weight:800">${esc(a.pista)}</h2>
        <form onsubmit="event.preventDefault();responder()"><input id="resp" class="in" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Respuesta">
        <div class="row" style="margin-top:12px"><button class="btn">Responder</button><button type="button" class="btn sec" onclick="sock.emit('rueda',{paso:true});vibra(30)">Paso</button></div></form>`,
        after: () => $('#resp').focus(), tick: () => { const c = $('#cuenta'); if (c) c.textContent = seg(r.eq[mt].tiempo); } };
    }
    case 'fin': {
      const f = S.fin;
      return { key: 'fin', html: () => `<div class="grow"></div><div class="res ${f.ganador === mt ? 'ok' : f.ganador ? 'ko' : ''}">${f.ganador === mt ? '¡Ganaron! 🎉' : f.ganador ? 'Gana ' + esc(equipoNombre(f.ganador)) : '¡Empate!'}</div>
        <p>${f.res.map((x) => esc(equipoNombre(x.team)) + ': ' + x.aciertos + (x.aciertos === 1 ? ' acierto' : ' aciertos')).join(' · ')}</p><div class="grow"></div>` };
    }
  }
  return { key: '?', html: () => '' };
}
function responder() { const v = $('#resp').value.trim(); if (v) { sock.emit('rueda', { texto: v }); vibra(30); } }
function cambiar() { me = { ...me, team: me.team === 'A' ? 'B' : 'A' }; sock.emit('join', me); }
function salir() { me = null; try { localStorage.removeItem('letramania-yo'); } catch (e) {} render(); }

function render() {
  const t = $('#top');
  if (me) { t.classList.remove('hidden'); t.className = me.team; $('#yo').innerHTML = `${esc(me.name)} · <span class="chip ${me.team}">${esc(equipoNombre(me.team))}</span>`; document.body.className = me.team; }
  else { t.classList.add('hidden'); document.body.className = ''; }
  const rj = S && S.reloj, n = rj ? Math.max(0, Math.ceil(rj.rem / 1000)) : 0;
  $('#relojM').textContent = rj ? '⏱ ' + n : '';
  $('#relojM').style.color = rj && n <= 5 ? 'var(--ko)' : '';
  const v = vista();
  if (v.key !== viewKey) { viewKey = v.key; $('#v').innerHTML = v.html(); v.after && v.after(); }
  v.tick && v.tick();
}
render();
</script>
</body></html>
