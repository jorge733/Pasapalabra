<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body{min-height:100dvh;font-size:18px}
  #top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:4px solid var(--team,var(--pend))}
  #top b{font-weight:900}
  #v{padding:20px 16px;display:flex;flex-direction:column;gap:14px;min-height:calc(100dvh - 60px)}
  h1{font-size:28px;margin:0;font-weight:900;text-align:center}
  h2{font-size:22px;margin:0;font-weight:900;text-align:center}
  p{margin:0;color:var(--muted);text-align:center;line-height:1.4}
  .in{width:100%;padding:16px;font-size:22px;border-radius:14px;border:3px solid var(--pend);background:var(--panel);color:var(--ink);outline:none;text-align:center}
  .in:focus{border-color:var(--team,var(--A))}
  .btn{width:100%;padding:18px;font-size:22px;font-weight:900;background:var(--team,var(--A));color:#111}
  .btn.sec{background:var(--panel);color:var(--ink)}
  .btn:active{transform:scale(.97)}
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .teams button{padding:22px 8px;font-size:18px;font-weight:900;color:#111;background:var(--team);opacity:.45}
  .teams button.sel{opacity:1;outline:4px solid #fff}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1}
  .opts button{font-size:20px;font-weight:900;padding:12px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .opts .k{font-size:32px}
  .o0{background:var(--o0)}.o1{background:var(--o1)}.o2{background:var(--o2)}.o3{background:var(--o3)}
  .buzz{flex:1;min-height:45vh;border-radius:50%;aspect-ratio:1;margin:auto;width:min(80vw,340px);font-size:34px;font-weight:900;background:var(--team);color:#111;box-shadow:0 10px 0 rgba(0,0,0,.35)}
  .buzz:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(0,0,0,.35)}
  .letra{font-size:80px;font-weight:900;text-align:center;line-height:1;color:var(--team)}
  .reloj{font-size:44px;font-weight:900;text-align:center}
  .res{font-size:30px;font-weight:900;text-align:center;padding:22px;border-radius:16px}
  .ok{background:var(--ok)} .ko{background:var(--ko)}
  .row{display:grid;grid-template-columns:2fr 1fr;gap:10px}
  .grow{flex:1}

  /* Bachillerato */
  .bcab{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:18px;padding:12px 14px;position:sticky;top:0;z-index:2;box-shadow:0 8px 18px rgba(0,0,0,.35)}
  .bcab .lt{flex:none;width:72px;height:80px;border-radius:14px;background:#fff;color:var(--bg);display:grid;place-items:center;font-size:56px;font-weight:900;line-height:1;animation:popM .45s both}
  .bcab .inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .bcab .inf small{color:var(--muted);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.12em}
  .bcab .inf b{font-size:17px;line-height:1.2}
  .bprog{height:8px;border-radius:8px;background:var(--pend);overflow:hidden}.bprog i{display:block;height:100%;background:var(--team);transition:width .3s}
  .bcats{display:flex;flex-direction:column;gap:10px}
  .bc{display:block;background:var(--panel);border-radius:16px;padding:10px 12px 12px;border:3px solid transparent;transition:border-color .2s}
  .bc .et{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;margin-bottom:8px}
  .bc .et .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--pend);display:grid;place-items:center;font-size:13px}
  .bc .et .st{margin-left:auto;font-size:13px;font-weight:800;color:var(--muted)}
  .bc input{width:100%;padding:13px 14px;font-size:20px;font-weight:800;border-radius:12px;border:2px solid var(--pend);background:var(--bg);color:var(--ink);outline:none}
  .bc input:focus{border-color:var(--team)}
  .bc.ok{border-color:var(--ok)}.bc.ok .et .n{background:var(--ok)}.bc.ok .et .st{color:var(--ok)}
  .bc.mal{border-color:var(--ko)}.bc.mal .et .n{background:var(--ko)}.bc.mal .et .st{color:var(--ko)}
  .bc.eq .et .st{color:var(--team)}
  .bpie{position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;flex-direction:column;gap:8px}
  .bpie .btn[disabled]{background:var(--pend);color:var(--muted)}
  .bpie .btn.listo{animation:pulsoM 1.4s ease-in-out infinite}
  .baviso{border-radius:14px;padding:10px 12px;font-weight:900;text-align:center;background:var(--ko);color:#fff;animation:popM .4s both}
  .baviso.mio{background:var(--team);color:#111}
  .bres{display:flex;flex-direction:column;gap:8px}
  .br{background:var(--panel);border-radius:14px;padding:10px 12px;border-left:6px solid var(--pend)}
  .br .c{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .br .r{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:900;margin-top:2px}
  .br .r .t{flex:1;min-width:0;overflow-wrap:anywhere}
  .br .ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#fff;background:var(--pend)}
  .br .pt{flex:none;padding:2px 10px;border-radius:999px;background:var(--ok);color:#06240f;font-size:16px}
  .br .ri{font-size:14px;color:var(--muted);font-weight:700;margin-top:4px}
  .br.ok,.br.si{border-left-color:var(--ok)}.br.ok .ic,.br.si .ic{background:var(--ok)}
  .br.duda{border-left-color:#0ea5e9}.br.duda .ic{background:#0ea5e9}
  .br.mal,.br.no{border-left-color:var(--ko)}.br.mal .ic,.br.no .ic{background:var(--ko)}.br.mal .t,.br.no .t{text-decoration:line-through;color:var(--muted)}
  .br.vacia .t{color:var(--muted)}

  /* ===== animaciones ===== */
  #v > *{animation:subirM .4s cubic-bezier(.2,.9,.3,1.2) both}
  #v > *:nth-child(2){animation-delay:.06s}#v > *:nth-child(3){animation-delay:.12s}#v > *:nth-child(4){animation-delay:.18s}#v > *:nth-child(5){animation-delay:.24s}
  @keyframes subirM{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .buzz:not([disabled]){animation:subirM .4s both,pulsoM 1.4s ease-in-out .4s infinite}
  @keyframes pulsoM{50%{box-shadow:0 10px 0 rgba(0,0,0,.35),0 0 0 14px color-mix(in srgb,var(--team) 35%,transparent)}}
  .res{animation:popM .5s cubic-bezier(.2,.9,.3,1.6) both}
  .res.ok{animation:popM .5s cubic-bezier(.2,.9,.3,1.6) both,festejo .8s .5s ease}
  @keyframes popM{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
  @keyframes festejo{25%{transform:rotate(-4deg) scale(1.05)}50%{transform:rotate(4deg) scale(1.05)}75%{transform:rotate(-2deg)}}
  .res.ko{animation:popM .4s both,temblorM .4s .4s}
  @keyframes temblorM{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
  .letra{animation:popM .45s both}
  .opts button{animation:subirM .35s both}
  .opts button:nth-child(2){animation-delay:.07s}.opts button:nth-child(3){animation-delay:.14s}.opts button:nth-child(4){animation-delay:.21s}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head><body>
<div id="top" class="hidden"><span>Letra<b style="color:var(--B)">manía</b></span><b id="relojM" style="font-size:22px"></b><span id="yo"></span></div>
<div id="v"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const seg = (ms) => Math.max(0, Math.ceil(ms / 1000));
const vibra = (p) => navigator.vibrate && navigator.vibrate(p);
let me = null, S = null, viewKey = '', enviado = {};
try { me = JSON.parse(localStorage.getItem('letramania-yo')); } catch (e) {}

const sock = io();
sock.on('connect', () => { if (me) sock.emit('join', me); });
sock.on('me', (m) => { me = m; try { localStorage.setItem('letramania-yo', JSON.stringify(m)); } catch (e) {} });
// Si el servidor se actualizó (se publicó una versión nueva), recarga la página para usar el código nuevo
let versionInicial = null;
function revisarVersion(s) {
  if (!s || !s.version) return false;
  if (versionInicial && s.version !== versionInicial) { location.reload(); return true; }
  versionInicial = versionInicial || s.version;
  return false;
}
sock.on('state', (s, ev) => {
  if (revisarVersion(s)) return;
  S = s;
  if (me && ev === 'turno' && s.phase === 'rueda' && s.rueda.turno === me.team) vibra([80, 60, 80]);
  if (me && ev === 'listo') vibra(40); // el botón «¡Lo sé!» se acaba de activar
  render();
});

function join(team) {
  const name = $('#nombre').value.trim();
  if (!name) { $('#nombre').focus(); return; }
  me = { name, team };
  sock.emit('join', me);
  render();
}
function equipoNombre(t) { return S ? S.teams[t].name : t; }

// Cada vista tiene una "clave": solo se redibuja entera cuando cambia, para no borrar lo que estás escribiendo.
function vista() {
  if (!me && S && S.solo) return { key: 'joinSolo', html: () => `
    <h1>¡Bienvenido!</h1><p>Escribe tu nombre para jugar</p>
    <input id="nombre" class="in" maxlength="16" placeholder="Tu nombre" autocomplete="off">
    <button class="btn" style="margin-top:12px" onclick="join('A')">¡A jugar!</button>` };
  if (!me) return { key: 'join', html: () => `
    <h1>¡Bienvenido!</h1><p>Escribe tu nombre y elige equipo</p>
    <input id="nombre" class="in" maxlength="16" placeholder="Tu nombre" autocomplete="off">
    <div class="teams"><button class="A" onclick="join('A')">${esc(equipoNombre('A'))}</button><button class="B" onclick="join('B')">${esc(equipoNombre('B'))}</button></div>` };
  if (!S) return { key: 'cargando', html: () => '<p>Conectando…</p>' };
  const mt = me.team, otro = mt === 'A' ? 'B' : 'A';
  switch (S.phase) {
    case 'lobby': return { key: 'lobby' + mt + S.teams[mt].name + !!S.solo, html: () => `
      <div class="grow"></div><h1>¡Estás dentro!</h1><p>${S.solo ? 'Modo solitario: juegas tú contra el reloj.' : 'Mira la tele.'} La partida empieza cuando el presentador lo diga.</p>
      <div class="grow"></div>${S.solo ? '' : '<button class="btn sec" onclick="cambiar()">Cambiar de equipo</button>'}
      <button class="btn sec" onclick="salir()">Cambiar nombre</button>` };
    case 'intro': return { key: 'intro' + S.intro.titulo, html: () => `
      <div class="grow"></div><h1>${esc(S.intro.titulo)}</h1><p>${esc(S.intro.texto)}</p><div class="grow"></div>` };
    case 'quiz': {
      const q = S.quiz;
      if (q.stage === 'reveal') return { key: 'pqr' + q.n, html: () => `<div class="grow"></div><div class="res ${q.gana[mt] ? 'ok' : 'ko'}">${q.gana[mt] ? '¡Correcto! +' + q.gana[mt] + ' s' : 'Sin puntos esta vez'}</div><div class="grow"></div>` };
      if (q.buzz && q.buzz.team === mt) return { key: 'pqm' + q.n, html: () => `<div class="grow"></div><h1>🔔 ¡Les toca!</h1><h2>Digan la respuesta en voz alta</h2><div class="grow"></div>` };
      if (q.buzz) return { key: 'pqo' + q.n, html: () => `<div class="grow"></div><h2>${esc(equipoNombre(q.buzz.team))} está respondiendo…</h2><div class="grow"></div>` };
      if (q.bloqueado[mt]) return { key: 'pql' + q.n, html: () => `<div class="grow"></div><h2>${S.solo ? 'Fallaste' : 'Tu equipo falló'} esta pregunta</h2><p>Espera a la siguiente</p><div class="grow"></div>` };
      return { key: 'pqb' + q.n + (q.espera > 0), html: () => `<p>Pregunta ${q.n}/${q.total} · escucha al presentador</p>${botonLoSe(q.espera)}`, tick: () => tickLoSe(q.espera) };
    }
    case 'oculta': {
      const o = S.oculta;
      if (o.stage === 'reveal') return { key: 'or' + o.n, html: () => `<div class="grow"></div>` + (o.ganador
        ? `<div class="res ${o.ganador.team === mt ? 'ok' : 'ko'}">${o.ganador.team === mt ? '¡Bien! +' + o.ganador.seg + ' s' : 'Acertó ' + esc(equipoNombre(o.ganador.team))}</div>`
        : '<h2>Nadie la acertó</h2>') + `<div class="grow"></div>` };
      if (o.buzz && o.buzz.team === mt) return { key: 'opm' + o.n, html: () => `<div class="grow"></div><h1>🔔 ¡Les toca!</h1><h2>Digan la palabra en voz alta</h2><div class="grow"></div>` };
      if (o.buzz) return { key: 'ob' + o.n + o.buzz.team, html: () => `<div class="grow"></div><h2>${esc(equipoNombre(o.buzz.team))} está respondiendo…</h2><div class="grow"></div>` };
      if (o.bloqueado[mt]) return { key: 'ol' + o.n, html: () => `<div class="grow"></div><h2>Tu equipo falló esta palabra</h2><p>Espera a la siguiente</p><div class="grow"></div>` };
      return { key: 'op' + o.n + (o.espera > 0), html: () => `<p>Palabra ${o.n}/${o.total}${o.pista ? ' · ' + esc(o.pista) : ' · escucha la pista'}</p>
        ${botonLoSe(o.espera)}`, tick: () => tickLoSe(o.espera) };
    }
    case 'vf': case 'antes': {
      const v = S.vf, k = v.kind + v.n;
      if (v.stage === 'reveal') return { key: 'vr' + k, html: () => `<div class="grow"></div><div class="res ${v.gana[mt] ? 'ok' : 'ko'}">${v.gana[mt] ? '¡Correcto! +3 s' : 'Era: ' + esc(v.opciones[v.correcta])}</div><div class="grow"></div>` };
      if (v.respondido[mt]) return { key: 'vw' + k, html: () => `<div class="grow"></div><h2>Respuesta de tu equipo enviada</h2><p>Esperando…</p><div class="grow"></div>` };
      const colores = v.kind === 'vf' ? ['var(--ok)', 'var(--ko)'] : ['var(--o1)', 'var(--o2)'];
      const marcas = v.kind === 'vf' ? ['✔ ', '✘ '] : ['A) ', 'B) '];
      return { key: 'va' + k, html: () => `<p>${esc(v.titulo)} · ${v.n}/${v.total}</p><h2>${esc(v.texto)}</h2>
        <div class="opts" style="grid-template-columns:1fr">${v.opciones.map((o, i) =>
          `<button style="background:${colores[i]};font-size:${v.kind === 'vf' ? 30 : 22}px" onclick="sock.emit('vf',${i});vibra(30)">${marcas[i]}${esc(o)}</button>`).join('')}</div>` };
    }
    case 'cifra': {
      const c = S.cifra, num = (x) => (c.unidad ? Number(x).toLocaleString('es-CL') : String(x));
      if (c.stage === 'reveal') return { key: 'cr' + c.n, html: () => `<div class="grow"></div>
        <div class="res ${c.gana[mt] ? 'ok' : 'ko'}">${c.gana[mt] ? '¡Bien! +' + c.gana[mt] + ' s' : 'Esta vez no'}</div>
        <p style="margin-top:10px">Respuesta: <b style="color:var(--ink)">${num(c.respuesta)} ${esc(c.unidad)}</b>${c.resp[mt] !== null ? ' · ustedes: ' + num(c.resp[mt]) : ''}</p><div class="grow"></div>` };
      if (c.respondido[mt]) return { key: 'cw' + c.n, html: () => `<div class="grow"></div><h2>Número de tu equipo enviado</h2><p>Esperando…</p><div class="grow"></div>` };
      return { key: 'ca' + c.n, html: () => `<p>Adivina la cifra · ${c.n}/${c.total}</p><h2>${esc(c.texto)}</h2>
        <form onsubmit="event.preventDefault();const v=$('#resp').value.trim();if(v){sock.emit('cifra',v);vibra(30)}">
        <input id="resp" class="in" inputmode="decimal" autocomplete="off" placeholder="Tu número${c.unidad ? ' (' + esc(c.unidad) + ')' : ''}">
        <button class="btn" style="margin-top:12px">Enviar</button></form>`, after: () => $('#resp').focus() };
    }
    case 'anagrama': case 'quiensoy': case 'refran': case 'adivinanza': case 'siglas':
    case 'quitaletras': case 'vertical': case 'pistas': case 'musical': case 'todos': {
      const p = S.p, k = p.kind + p.n + (p.tablero ? 't' + p.tablero.num : '');
      if (p.stage === 'reveal') return { key: 'pr' + k, html: () => `<div class="grow"></div>` + (p.ganador
        ? `<div class="res ${p.ganador.team === mt ? 'ok' : 'ko'}">${p.ganador.team === mt ? '¡Bien! +' + p.ganador.seg + ' s' : 'Acertó ' + esc(equipoNombre(p.ganador.team))}</div>`
        : '<h2>Nadie lo acertó</h2>') + `<p style="margin-top:10px">${esc(p.respuesta)}</p><div class="grow"></div>` };
      if (p.buzz && p.buzz.team === mt) return { key: 'pm' + k, html: () => `<div class="grow"></div><h1>🔔 ¡Les toca!</h1><h2>Digan la respuesta en voz alta</h2><div class="grow"></div>` };
      if (p.buzz) return { key: 'pb' + k + p.buzz.team, html: () => `<div class="grow"></div><h2>${esc(equipoNombre(p.buzz.team))} está respondiendo…</h2><div class="grow"></div>` };
      if (p.stage === 'preparar') return { key: 'pq' + k, html: () => `<div class="grow"></div><h1>🎧</h1><h2>El presentador está poniendo la canción</h2><p>Cuando suene, ¡presionen «¡Lo sé!» si la conocen!</p><div class="grow"></div>` };
      if (p.bloqueado[mt]) return { key: 'pl' + k, html: () => `<div class="grow"></div><h2>Tu equipo falló esta</h2><p>Espera a la siguiente</p><div class="grow"></div>` };
      return { key: 'pp' + k + (p.espera > 0), html: () => `<p>${esc(p.titulo)} · ${p.n}/${p.total} · ${p.kind === 'musical' ? '¿cómo se llama la canción?' : p.kind === 'todos' ? (p.obra ? '¿de qué película o serie es?' : '¿quién la canta?') : 'escucha al presentador'}</p>
        ${botonLoSe(p.espera)}`, tick: () => tickLoSe(p.espera) };
    }
    case 'letraaletra': case 'cruzadas': case 'memoria': case 'unade4': case 'deletrea': {
      const u = S.turnos, mio = u.turno === mt, R = u.resumen[mt];
      if (u.stage === 'reveal') return { key: 'tr' + u.kind, html: () => `<div class="grow"></div><div class="res ${R && R.gana ? 'ok' : 'ko'}">${R && R.gana ? '¡Bien! +' + R.gana + ' s' : 'Esta vez no'}</div>
        <p>${R ? R.aciertos + (R.aciertos === 1 ? ' acierto' : ' aciertos') : ''}</p><div class="grow"></div>` };
      if (!mio) return { key: 'tw' + u.n + u.stage, html: () => `<div class="grow"></div><h2>Turno de ${esc(equipoNombre(u.turno))}</h2>
        <p>${R && R.jugado ? `Ustedes ya jugaron: ${R.aciertos} ✔ · +${R.gana} s` : 'Ustedes juegan después. ¡Atentos a la tele!'}</p><div class="grow"></div>` };
      if (u.stage === 'elegir') return { key: 'te' + u.n, html: () => `<h1>¡Les toca!</h1><h2>Elijan un tema</h2>
        <div class="opts" style="grid-template-columns:1fr">${u.temas.map((t, k) => `<button class="o${k + 1}" onclick="sock.emit('tema',${k});vibra(40)">${esc(t)}</button>`).join('')}</div>` };
      if (u.stage === 'memorizar') return { key: 'tm' + u.n, html: () => `<div class="grow"></div><h1>🧠 ¡Memoricen!</h1><h2>Miren el tablero de la tele: enseguida se tapa</h2><div class="grow"></div>` };
      if (u.stage === 'finTurno') return { key: 'tf' + u.n, html: () => `<div class="grow"></div><div class="res ${R.gana ? 'ok' : 'ko'}">${R.aciertos} ${R.aciertos === 1 ? 'acierto' : 'aciertos'} · +${R.gana} s</div><div class="grow"></div>` };
      const fb = u.ultimo ? { acierto: '<p style="color:var(--ok)">¡Correcto!</p>', fallo: `<p style="color:var(--ko)">Incorrecto${u.ultimo.correcta ? ' · era ' + esc(u.ultimo.correcta) : ''}${u.kind === 'memoria' ? ' · el tablero se reinició' : ''}</p>`,
        paso: `<p style="color:#a5b4fc">Pasapalabra${u.kind === 'memoria' ? ' · el tablero se reinició' : ''}</p>` }[u.ultimo.tipo] : '';
      const MODO_D = { normal: 'Deletreo normal', azar: 'Al azar: deletreen en el orden de los números de la tele', reves: 'Al revés: desde la última letra' };
      const pregunta = u.kind === 'memoria' ? (u.actual !== null && u.actual !== undefined ? `¿Cuál era la palabra ${u.actual + 1}? (se cuentan desde abajo)` : '')
        : u.kind === 'deletrea' ? (u.pista ? `${MODO_D[u.modo]}. ${esc(u.pista)}` : '')
        : !u.pista ? '' : u.kind === 'letraaletra' ? `Contiene ${esc([...u.letras].join(' y '))}: ${esc(u.pista)}` : esc(u.pista);
      const clave = 'tp' + u.n + '-' + u.actual + '-' + (u.ultimo ? u.ultimo.t : '');
      const paso = u.kind === 'deletrea' ? '' : `<button type="button" class="btn sec" onclick="sock.emit('turno',{paso:true});vibra(30)">Pasapalabra</button>`; // en Deletrea no se pasa
      return { key: clave, html: () => `<div class="reloj" id="cuenta"></div>${fb}<h2>${pregunta}</h2>
        <p>🎙️ Respondan en voz alta</p><div class="grow"></div>${paso}`, tick: () => { const c = $('#cuenta'); if (c) c.textContent = seg(u.resumen[mt].tiempo); } };
    }
    case 'tutifruti': {
      const u = S.tuti, nc = u.categorias.length;
      if (u.stage === 'ask') return { key: 'tf' + u.n, html: () => `
        <div class="bcab"><div class="lt">${esc(u.letra)}</div><div class="inf"><small>Bachillerato · letra ${u.n} de ${u.total}</small>
          <b>Una palabra con <span style="color:var(--team)">${esc(u.letra)}</span> en cada categoría</b>
          <div class="bprog"><i id="bProg" style="width:0"></i></div></div></div>
        <div id="bastaMsg"></div>
        <div class="bcats">${u.categorias.map((c, k) => `
          <label class="bc" id="bc${k}"><div class="et"><span class="n">${k + 1}</span><span>${esc(c)}</span><span class="st"></span></div>
          <input class="tf" data-k="${k}" enterkeyhint="${k < nc - 1 ? 'next' : 'done'}" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"
            placeholder="Empieza con ${esc(u.letra)}…" oninput="tuti(this)" onkeydown="sigTuti(event,this)"></label>`).join('')}</div>
        <div class="bpie"><button class="btn" id="bBasta" onclick="basta()">✋ ¡Basta!</button></div>`,
        after: () => { const i = document.querySelector('.tf'); if (i) i.focus(); },
        tick: () => estadoTuti(u) };
      const r = u.resp ? u.resp[mt] : [], m = u.marcas ? u.marcas[mt] : [], rev = u.stage === 'reveal';
      const ICON = { ok: '✔', si: '✔', duda: '?', mal: '✘', no: '✘', vacia: '' };
      const cab = rev
        ? `<div class="res ${u.gana[mt] ? 'ok' : 'ko'}">${u.gana[mt] ? '¡Bien! +' + u.gana[mt] + ' s' : 'Esta vez no'}</div>
           ${S.solo ? '' : `<p>${esc(equipoNombre(otro))}: +${u.gana[otro]} s</p>`}`
        : `<h2>🔎 Revisando respuestas…</h2><p>El presentador puede aceptar o rechazar las que tienen «?». ¡Miren la tele!</p>`;
      return { key: 'tfr' + u.n + u.stage + JSON.stringify(m), html: () => `
        <div class="bcab"><div class="lt">${esc(u.letra)}</div><div class="inf"><small>Bachillerato · letra ${u.n} de ${u.total}</small>
          <b>${rev ? 'Resultado' : 'Sus respuestas'}</b></div></div>
        ${cab}
        <div class="bres">${u.categorias.map((c, k) => {
          const pts = u.puntos ? u.puntos[k][mt] : 0, ej = rev && u.ejemplos && u.ejemplos[k] ? u.ejemplos[k] : [];
          return `<div class="br ${m[k]}"><div class="c">${esc(c)}</div>
            <div class="r"><span class="t">${esc(r[k]) || 'Sin respuesta'}</span>${pts ? `<span class="pt">+${pts}</span>` : ''}${ICON[m[k]] ? `<span class="ic">${ICON[m[k]]}</span>` : ''}</div>
            <div class="ri">${S.solo ? (ej.length ? `p. ej. ${ej.map(esc).join(', ')}` : '') : `${esc(equipoNombre(otro))}: ${esc(u.resp[otro][k]) || '—'}${ej.length ? ` · p. ej. ${ej.map(esc).join(', ')}` : ''}`}</div></div>`;
        }).join('')}</div>` };
    }
    case 'rueda': {
      const r = S.rueda;
      if (r.turno !== mt) return { key: 'rw' + r.turno, html: () => `<div class="grow"></div><h2>Turno de ${esc(equipoNombre(r.turno))}</h2>
        <p>Atentos: cuando fallen o pasen, les toca.</p><div class="reloj" id="cuenta"></div><p>segundos te quedan</p><div class="grow"></div>`,
        tick: () => { const c = $('#cuenta'); if (c) c.textContent = seg(r.eq[mt].tiempo); } };
      if (r.stage !== 'play' || !r.actual) {
        const u = r.ultimo || {};
        const msg = { fallo: ['ko', 'Incorrecto · era ' + esc((u.correcta || '').toUpperCase())], paso: ['', '¡Paso!'], tiempo: ['ko', '¡Sin tiempo!'], acierto: ['ok', '¡Correcto!'] }[u.tipo] || ['', '…'];
        return { key: 'rf' + (u.t || ''), html: () => `<div class="grow"></div><div class="res ${msg[0]}" style="${msg[0] ? '' : 'background:#6366f1'}">${msg[1]}</div><div class="grow"></div>` };
      }
      const a = r.actual;
      return { key: 'rpp' + a.letra, html: () => `
        <div class="reloj" id="cuenta"></div>
        <p>${a.tipo === 'empieza' ? 'Empieza por' : 'Contiene la'}</p><div class="letra">${a.letra}</div>
        <h2>🎙️ Escucha la definición y responde en voz alta</h2><div class="grow"></div>
        <button class="btn sec" style="padding:26px" onclick="sock.emit('rueda',{paso:true});vibra(30)">Paso</button>`,
        tick: () => { const c = $('#cuenta'); if (c) c.textContent = seg(r.eq[mt].tiempo); } };
    }
    case 'fin': {
      const f = S.fin;
      if (f.solo) { const x = f.res[0]; return { key: 'fin', html: () => `<div class="grow"></div><div class="res ${f.ganador ? 'ok' : ''}">${f.ganador ? '¡Rueda completa! 🎉' : '¡Buen juego!'}</div>
        <p>${x.aciertos} de ${f.total} letras · ${x.fallos} ${x.fallos === 1 ? 'fallo' : 'fallos'}</p><div class="grow"></div>` }; }
      return { key: 'fin', html: () => `<div class="grow"></div><div class="res ${f.ganador === mt ? 'ok' : f.ganador ? 'ko' : ''}">${f.ganador === mt ? '¡Ganaron! 🎉' : f.ganador ? 'Gana ' + esc(equipoNombre(f.ganador)) : '¡Empate!'}</div>
        <p>${f.res.map((x) => esc(equipoNombre(x.team)) + ': ' + x.aciertos + (x.aciertos === 1 ? ' acierto' : ' aciertos')).join(' · ')}</p><div class="grow"></div>` };
    }
  }
  return { key: '?', html: () => '' };
}
// Botón «¡Lo sé!»: bloqueado mientras corre el tiempo para pensar
function botonLoSe(espera) {
  return espera > 0
    ? `<button class="buzz" disabled style="opacity:.45;font-size:26px">🤔 Piensa…<br><span id="bzc" style="font-size:44px">${seg(espera)}</span></button>`
    : `<button class="buzz" onclick="sock.emit('buzz');vibra(60)">¡Lo sé!</button>`;
}
function tickLoSe(espera) { const c = $('#bzc'); if (c) c.textContent = seg(espera); }
// Bachillerato: cada casilla se envía mientras se escribe; «¡Basta!» detiene la ronda (solo con todo lleno)
const inicial = (t) => String(t || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').charAt(0);
function tuti(el) { sock.emit('tuti', { k: Number(el.dataset.k), texto: el.value }); estadoTuti(S.tuti); }
// Enter pasa a la siguiente categoría (no grita «Basta» por accidente)
function sigTuti(e, el) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const sig = document.querySelector(`.tf[data-k="${Number(el.dataset.k) + 1}"]`);
  sig ? sig.focus() : el.blur();
}
// Estado de cada casilla: lista (empieza bien), no empieza por la letra, o ya la llenó un compañero desde otro celular
function estadoTuti(u) {
  if (!u || u.stage !== 'ask' || !me) return;
  const mt = me.team, L = u.letra.toLowerCase(), eq = u.llenasK ? u.llenasK[mt] : [];
  let listas = 0, malas = 0;
  document.querySelectorAll('.tf').forEach((i) => {
    const k = Number(i.dataset.k), v = i.value.trim(), c = $('#bc' + k), st = c.querySelector('.st');
    let cls = '', txt = '';
    if (v && inicial(v) !== L) { cls = 'mal'; txt = `No empieza con ${u.letra}`; malas++; }
    else if (v) { cls = 'ok'; txt = '✔ Lista'; listas++; }
    else if (eq[k]) { cls = 'eq'; txt = '✔ La llenó tu equipo'; listas++; }
    c.className = 'bc ' + cls; st.textContent = txt;
  });
  const p = $('#bProg'); if (p) p.style.width = (100 * listas) / u.categorias.length + '%';
  const faltan = u.categorias.length - listas, b = $('#bBasta');
  if (b) {
    b.disabled = !!u.basta || faltan > 0;
    b.classList.toggle('listo', !u.basta && !faltan);
    b.textContent = u.basta ? '✋ ¡Basta!' : faltan ? `Faltan ${faltan} para gritar «¡Basta!»` : malas ? '✋ ¡Basta! (revisen las marcadas en rojo)' : '✋ ¡Basta!';
  }
  const m = $('#bastaMsg');
  if (m) m.innerHTML = !u.basta ? '' : u.basta === mt ? `<div class="baviso mio">✋ ¡Gritaron «Basta»! Pueden seguir corrigiendo</div>`
    : `<div class="baviso">✋ ¡${esc(equipoNombre(u.basta))} gritó «Basta»! ¡Apúrense!</div>`;
}
function basta() {
  document.querySelectorAll('.tf').forEach((i) => i.value.trim() && tuti(i));
  sock.emit('basta'); vibra(60);
}
function cambiar() { me = { ...me, team: me.team === 'A' ? 'B' : 'A' }; sock.emit('join', me); }
function salir() { me = null; try { localStorage.removeItem('letramania-yo'); } catch (e) {} render(); }

function render() {
  const t = $('#top');
  if (me) { t.classList.remove('hidden'); t.className = me.team; $('#yo').innerHTML = `${esc(me.name)} · <span class="chip ${me.team}">${esc(equipoNombre(me.team))}</span>`; document.body.className = me.team; }
  else { t.classList.add('hidden'); document.body.className = ''; }
  const rj = S && S.reloj, n = rj ? Math.max(0, Math.ceil(rj.rem / 1000)) : 0;
  $('#relojM').textContent = rj ? '⏱ ' + n : '';
  $('#relojM').style.color = rj && n <= 5 ? 'var(--ko)' : '';
  const v = vista();
  if (v.key !== viewKey) { viewKey = v.key; $('#v').innerHTML = v.html(); v.after && v.after(); }
  v.tick && v.tick();
}
render();
</script>
</body></html>
