<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d0b1f">
<title>Letramanía · Tele</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body{overflow:hidden;font-size:2.2vmin}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:2vmin 4vmin}
  header .score{justify-self:end}
  #reloj{display:flex;align-items:center;gap:1.5vmin;background:var(--panel);border-radius:999px;padding:.8vmin 3vmin;font-weight:900;font-size:5.5vmin;min-width:20vmin;justify-content:center;border:.5vmin solid var(--pend);transition:background .3s,border-color .3s}
  #reloj:empty{visibility:hidden}
  #reloj.bajo{background:var(--ko);border-color:#fff;animation:latido 1s infinite}
  #reloj.parado{opacity:.55}
  #reloj small{font-size:2vmin;color:var(--muted);font-weight:800}
  @keyframes latido{50%{transform:scale(1.08)}}
  .logo{font-weight:900;font-size:4.2vmin;letter-spacing:.02em}
  .logo span{color:var(--B)}
  .score{display:flex;gap:2vmin}
  .score .t{background:var(--panel);border-left:1vmin solid var(--team);border-radius:1.5vmin;padding:1vmin 2.2vmin;min-width:22vmin}
  .score .n{font-size:2vmin;color:var(--muted);font-weight:800}
  .score .v{font-size:4vmin;font-weight:900}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:0 4vmin 4vmin;position:relative}
  .big{font-size:6vmin;font-weight:900;text-align:center;line-height:1.15}
  .sub{font-size:3vmin;color:var(--muted);text-align:center;max-width:70vw;margin:2vmin auto 0;line-height:1.4}

  /* lobby */
  .lobby{display:grid;grid-template-columns:auto 1fr;gap:6vmin;align-items:center}
  .qr{background:#fff;padding:2vmin;border-radius:2vmin;width:42vmin}
  .qr img{width:100%;display:block}
  .url{font-size:2.6vmin;color:var(--muted);margin-top:1.5vmin;text-align:center}
  .equipos{display:grid;grid-template-columns:1fr 1fr;gap:3vmin;margin-top:4vmin}
  .equipo{background:var(--panel);border-top:1vmin solid var(--team);border-radius:2vmin;padding:2vmin 3vmin;min-height:24vmin}
  .equipo h3{margin:0 0 1vmin;font-size:3.2vmin;color:var(--team)}
  .equipo li{font-size:3vmin;font-weight:800;list-style:none;margin:.5vmin 0}
  .equipo ul{padding:0;margin:0}

  /* quiz */
  .q{width:min(90vw,150vmin)}
  .qtxt{font-size:5.4vmin;font-weight:900;text-align:center;margin-bottom:4vmin;line-height:1.2}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:2.5vmin}
  .opt{padding:3vmin;border-radius:2vmin;font-size:4vmin;font-weight:900;display:flex;gap:2vmin;align-items:center;transition:opacity .3s,transform .3s}
  .opt .k{width:6vmin;height:6vmin;border-radius:50%;background:rgba(0,0,0,.25);display:grid;place-items:center;flex:none}
  .opt.dim{opacity:.25}.opt.win{transform:scale(1.04);outline:.6vmin solid #fff}
  .o0{background:var(--o0)}.o1{background:var(--o1)}.o2{background:var(--o2)}.o3{background:var(--o3)}
  .bar{height:1.4vmin;background:var(--pend);border-radius:1vmin;overflow:hidden;margin-top:4vmin}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--B),var(--ko));transition:width .5s linear}
  .estado{display:flex;justify-content:center;gap:3vmin;margin-top:3vmin;font-size:3vmin;font-weight:800}
  .estado .chip{opacity:.35}.estado .chip.on{opacity:1}

  /* oculta */
  .pista{font-size:3.4vmin;color:var(--muted);text-align:center;font-weight:800;text-transform:uppercase;letter-spacing:.2em}
  .tiles{display:flex;gap:1.2vmin;justify-content:center;margin:4vmin 0;flex-wrap:wrap}
  .tile{width:9vmin;height:11vmin;border-radius:1.4vmin;background:var(--panel);border:.4vmin solid var(--pend);display:grid;place-items:center;font-size:7vmin;font-weight:900}
  .tile.on{background:#fff;color:var(--bg);border-color:#fff;animation:pop .35s}
  .tile.sp{background:none;border:0;width:4vmin}
  @keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
  .aviso{font-size:4.4vmin;font-weight:900;text-align:center;min-height:6vmin}

  /* rueda */
  .rueda-wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:3vmin;width:100%}
  .rueda{position:relative;width:78vmin;height:78vmin}
  .rueda .l{position:absolute;width:6.6vmin;height:6.6vmin;margin:-3.3vmin;border-radius:50%;display:grid;place-items:center;
    font-weight:900;font-size:3.4vmin;background:var(--team);color:#111;transition:background .3s,transform .3s}
  .rueda .l.acierto{background:var(--ok);color:#fff}
  .rueda .l.fallo{background:var(--ko);color:#fff}
  .rueda .l.cur{transform:scale(1.35);box-shadow:0 0 0 .5vmin #fff,0 0 4vmin var(--team)}
  .centro{position:absolute;inset:14vmin;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vmin}
  .centro .tipo{font-size:2.6vmin;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.1em}
  .centro .letra{font-size:12vmin;font-weight:900;line-height:1;color:var(--team)}
  .centro .def{font-size:3.2vmin;font-weight:800;line-height:1.25;margin-top:1.5vmin}
  .lado{background:var(--panel);border-radius:2vmin;padding:2.5vmin;border-top:1vmin solid var(--team);text-align:center;opacity:.5;transition:opacity .3s}
  .lado.on{opacity:1}
  .lado .nom{font-weight:900;font-size:3vmin;color:var(--team)}
  .lado .reloj{font-size:9vmin;font-weight:900}
  .lado .cnt{font-size:2.8vmin;font-weight:800;color:var(--muted)}
  .mini{display:flex;flex-wrap:wrap;gap:.5vmin;justify-content:center;margin-top:1.5vmin}
  .mini b{width:2.6vmin;height:2.6vmin;border-radius:50%;background:var(--team);font-size:1.4vmin;display:grid;place-items:center;color:#111}
  .mini b.acierto{background:var(--ok)}.mini b.fallo{background:var(--ko)}
  .flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:9vmin;font-weight:900;padding:2vmin 6vmin;border-radius:3vmin;
    background:var(--c);color:#fff;box-shadow:0 2vmin 8vmin rgba(0,0,0,.6);text-align:center;animation:popc .3s;z-index:5}
  @keyframes popc{from{transform:translate(-50%,-50%) scale(.6)}to{transform:translate(-50%,-50%) scale(1)}}
  .flash small{display:block;font-size:3.6vmin;font-weight:800;margin-top:1vmin}

  .pausa{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;font-size:8vmin;font-weight:900;z-index:9}
  #sonido{position:fixed;bottom:2vmin;right:2vmin;background:var(--panel);padding:1.5vmin 2.5vmin;font-size:2.2vmin;z-index:10}

  /* ================= ANIMACIONES ================= */
  /* fondo animado */
  .fondo{position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;
    background:radial-gradient(circle at 20% 30%,rgba(139,92,246,.22),transparent 28%),radial-gradient(circle at 80% 70%,rgba(245,158,11,.16),transparent 30%),radial-gradient(circle at 60% 15%,rgba(37,99,235,.14),transparent 25%);
    animation:deriva 22s ease-in-out infinite alternate}
  @keyframes deriva{to{transform:translate(6vmax,-4vmax) rotate(8deg)}}
  body{background:var(--bg)}
  /* cada pantalla nueva (pregunta, prueba, turno) entra con movimiento */
  .vista{animation:entrar .55s cubic-bezier(.2,.9,.3,1.2) both;width:100%;display:flex;justify-content:center}
  @keyframes entrar{from{opacity:0;transform:translateY(4vmin) scale(.97)}to{opacity:1;transform:none}}
  .vista .pista{animation:bajar .5s both}
  .vista .qtxt{animation:subir .55s .1s both}
  .vista .opt{animation:subir .5s both}
  .vista .opt:nth-child(1){animation-delay:.2s}.vista .opt:nth-child(2){animation-delay:.3s}
  .vista .opt:nth-child(3){animation-delay:.4s}.vista .opt:nth-child(4){animation-delay:.5s}
  .vista .estado{animation:subir .5s .5s both}
  @keyframes subir{from{opacity:0;transform:translateY(3vmin)}to{opacity:1;transform:none}}
  @keyframes bajar{from{opacity:0;transform:translateY(-2vmin)}to{opacity:1;transform:none}}
  .opt.win{animation:ganadora .7s ease both}
  @keyframes ganadora{0%{transform:scale(1)}40%{transform:scale(1.1);box-shadow:0 0 6vmin rgba(255,255,255,.6)}100%{transform:scale(1.04)}}
  /* fichas que se dan vuelta */
  .tile.on{animation:voltear .5s ease both}
  @keyframes voltear{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
  .tile:not(.on){animation:latidoSuave 2.4s ease-in-out infinite}
  @keyframes latidoSuave{50%{border-color:var(--muted)}}
  /* intro de cada prueba */
  .intro-icono{font-size:16vmin;line-height:1;animation:girarEntrar .8s cubic-bezier(.2,.9,.3,1.4) both}
  @keyframes girarEntrar{from{opacity:0;transform:scale(.2) rotate(-200deg)}to{opacity:1;transform:none}}
  .intro-titulo{animation:zoom .6s .15s cubic-bezier(.2,.9,.3,1.3) both}
  @keyframes zoom{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:none}}
  .intro-texto{animation:subir .6s .45s both}
  .intro-cuenta{animation:latido 1s infinite}
  /* rueda */
  .rueda .l{animation:aparecer .45s calc(var(--d) * 1ms) cubic-bezier(.2,.9,.3,1.5) both}
  @keyframes aparecer{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:none}}
  .rueda .l.cur{animation:brillo 1.2s ease-in-out infinite}
  @keyframes brillo{0%,100%{transform:scale(1.3);box-shadow:0 0 0 .5vmin #fff,0 0 3vmin var(--team)}50%{transform:scale(1.45);box-shadow:0 0 0 .7vmin #fff,0 0 7vmin var(--team)}}
  .rueda .l.acierto,.rueda .l.fallo{animation:sello .6s ease both}
  @keyframes sello{0%{transform:scale(1)}40%{transform:scale(1.6) rotate(20deg)}100%{transform:none}}
  .centro{animation:centroEntra .6s .2s both}
  @keyframes centroEntra{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  .centro .letra{animation:zoom .45s cubic-bezier(.2,.9,.3,1.4) both}
  .lado.on{animation:resaltar 2s ease-in-out infinite}
  @keyframes resaltar{50%{box-shadow:0 0 4vmin var(--team)}}
  /* marcador */
  .score .t.bump{animation:bump .7s ease}
  @keyframes bump{30%{transform:scale(1.18);box-shadow:0 0 4vmin var(--team)}}
  .flotante{position:fixed;z-index:20;font-weight:900;font-size:5vmin;color:var(--ok);text-shadow:0 .4vmin 1.5vmin rgba(0,0,0,.6);pointer-events:none;animation:flotar 1.6s ease-out forwards}
  @keyframes flotar{from{opacity:0;transform:translateY(2vmin) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.2)}to{opacity:0;transform:translateY(-12vmin) scale(1)}}
  /* destello de color al presionar «¡Lo sé!» y temblor al fallar */
  .destello{position:fixed;inset:0;z-index:15;pointer-events:none;background:radial-gradient(circle,var(--c) 0%,transparent 70%);animation:destello .7s ease-out forwards}
  @keyframes destello{from{opacity:.75}to{opacity:0}}
  #app.temblor{animation:temblor .45s}
  @keyframes temblor{20%{transform:translateX(-1.5vmin)}40%{transform:translateX(1.5vmin)}60%{transform:translateX(-1vmin)}80%{transform:translateX(1vmin)}}
  /* lobby */
  .qr{animation:flotarQR 4s ease-in-out infinite}
  @keyframes flotarQR{50%{transform:translateY(-1.5vmin) rotate(-1deg)}}
  .equipo li{animation:subir .4s both}
  /* final */
  .fin-titulo{animation:rebote 1s cubic-bezier(.2,.9,.3,1.6) both}
  @keyframes rebote{from{opacity:0;transform:scale(.3) translateY(-10vmin)}to{opacity:1;transform:none}}
  .trofeo{font-size:16vmin;animation:girarEntrar 1s both,flotarQR 3s 1s ease-in-out infinite}
  #confeti{position:fixed;inset:0;z-index:30;pointer-events:none}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head><body>
<div class="fondo"></div>
<canvas id="confeti"></canvas>
<div id="app">
  <header><div class="logo">Letra<span>manía</span></div><div id="reloj"></div><div class="score" id="score"></div></header>
  <main id="main"></main>
</div>
<button id="sonido">🔊 Presiona para activar el sonido</button>
<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/idiomorph.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const seg = (ms) => Math.max(0, Math.ceil(ms / 1000));
const LETRAS_OPC = ['A', 'B', 'C', 'D'];

// --- sonido sintetizado ---
let ac = null;
$('#sonido').onclick = () => { ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); $('#sonido').remove(); tono([523, 659, 784], .12); };
function tono(fs, d = .15, tipo = 'sine') {
  if (!ac) return;
  fs.forEach((f, i) => {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * d;
    o.type = tipo; o.frequency.value = f; g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + d * 1.8);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d * 2);
  });
}
const SFX = {
  ok: () => tono([660, 880, 1320], .1), fail: () => tono([300, 200], .22, 'sawtooth'),
  paso: () => tono([500, 400], .12, 'triangle'), buzz: () => tono([880], .25, 'square'),
  reveal: () => tono([440, 660], .12), turno: () => tono([700], .08), tiempo: () => tono([400, 300, 200], .25, 'sawtooth'),
  join: () => tono([880, 1100], .06), listo: () => tono([660, 990], .09), fin: () => tono([523, 659, 784, 1047, 784, 1047], .14),
};

const sock = io();
let S = null, flashHasta = 0;
sock.on('state', (s, ev) => {
  S = s;
  if (ev && SFX[ev]) SFX[ev]();
  if (s.phase === 'rueda' && s.rueda.ultimo && ['ok', 'fail', 'paso', 'tiempo'].includes(ev)) flashHasta = Date.now() + (ev === 'ok' ? 900 : 2600);
  render();
  efectos(ev);
});

// ---------- efectos ----------
const COLOR = { A: '#8b5cf6', B: '#f59e0b' };
let bonusPrevio = null;
function animarBonus() {
  if (!S || S.phase === 'lobby') { bonusPrevio = null; return; }
  const ahora = { A: S.teams.A.bonus, B: S.teams.B.bonus };
  if (bonusPrevio) for (const t of ['A', 'B']) {
    const dif = ahora[t] - bonusPrevio[t], el = document.getElementById('sc-' + t);
    if (dif > 0 && el) {
      el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
      const r = el.getBoundingClientRect(), f = document.createElement('div');
      f.className = 'flotante'; f.textContent = `+${dif} s`;
      f.style.left = r.left + r.width / 2 - 40 + 'px'; f.style.top = r.bottom + 10 + 'px';
      document.body.appendChild(f); setTimeout(() => f.remove(), 1700);
    }
  }
  bonusPrevio = ahora;
}
function destello(color) {
  const d = document.createElement('div'); d.className = 'destello'; d.style.setProperty('--c', color);
  document.body.appendChild(d); setTimeout(() => d.remove(), 800);
}
function temblor() { const a = $('#app'); a.classList.remove('temblor'); void a.offsetWidth; a.classList.add('temblor'); }
function efectos(ev) {
  if (!ev || !S) return;
  const dato = S.quiz || S.oculta || S.p;
  if (ev === 'buzz' && dato && dato.buzz) destello(COLOR[dato.buzz.team]);
  if (ev === 'ok') confeti(S.phase === 'rueda' ? 40 : 70);
  if (ev === 'fail' || ev === 'tiempo') temblor();
  if (ev === 'turno' && S.rueda) destello(COLOR[S.rueda.turno]);
  if (ev === 'fin') { confeti(250); setTimeout(() => confeti(200), 900); setTimeout(() => confeti(200), 1800); }
}

// ---------- confeti (dibujado en un canvas) ----------
const cv = $('#confeti'), cx = cv.getContext('2d');
let piezas = [], animando = false;
function confeti(n) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#8b5cf6', '#f59e0b', '#22c55e', '#ef4444', '#2563eb', '#ffffff'];
  for (let i = 0; i < n; i++) piezas.push({
    x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .3, y: innerHeight * .35,
    vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 6, g: .35 + Math.random() * .2,
    w: 6 + Math.random() * 8, h: 8 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: cols[Math.floor(Math.random() * cols.length)], vida: 0,
  });
  if (!animando) { animando = true; requestAnimationFrame(paso); }
}
function paso() {
  cx.clearRect(0, 0, cv.width, cv.height);
  piezas = piezas.filter((p) => p.y < cv.height + 40 && p.vida < 400);
  for (const p of piezas) {
    p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vida++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.cos(p.vida / 6)); cx.restore();
  }
  if (piezas.length) requestAnimationFrame(paso); else { animando = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

function score() {
  if (!S || S.phase === 'lobby') return '';
  return ['A', 'B'].map((t) => `<div id="sc-${t}" class="t ${t}"><div class="n">${esc(S.teams[t].name)}</div><div class="v">+${S.teams[t].bonus} s</div></div>`).join('');
}

let ultimoSeg = null, claveAnterior = null;
function pintarReloj() {
  const el = $('#reloj'), r = S && S.reloj;
  if (!r) { el.innerHTML = ''; el.className = ''; ultimoSeg = null; return; }
  const n = seg(r.rem);
  if (r.pensar) { el.innerHTML = `🤔 ${n} <small>PIENSEN</small>`; el.className = ''; ultimoSeg = null; return; }
  el.innerHTML = `⏱ ${n}${r.parado ? ' <small>EN PAUSA</small>' : ''}`;
  el.className = (n <= 5 && !r.parado ? 'bajo' : '') + (r.parado ? ' parado' : '');
  if (n !== ultimoSeg && n <= 5 && n > 0 && !r.parado) tono([1000], .05, 'square'); // tic en los últimos segundos
  ultimoSeg = n;
}
function render() {
  pintarReloj();
  Idiomorph.morph($('#score'), S.phase === 'rueda' || S.phase === 'fin' ? '' : score(), { morphStyle: 'innerHTML' });
  animarBonus();
  const m = $('#main');
  let h = '';
  if (S.phase === 'lobby') {
    const lista = (t) => S.players.filter((p) => p.team === t).map((p) => `<li id="pl-${t}-${encodeURIComponent(p.name).replace(/%/g, '')}">${esc(p.name)}</li>`).join('') || '<li style="color:var(--muted)">Esperando jugadores…</li>';
    h = `<div class="lobby">
      <div><div class="qr"><img src="/qr.svg" alt="QR"></div><div class="url">${esc(S.base)}/play</div></div>
      <div><div class="big" style="text-align:left">Escanea el QR<br>para jugar</div>
        <div class="sub" style="text-align:left;margin:2vmin 0 0">Elige equipo en tu celular. El presentador empieza la partida cuando estén todos.</div>
        <div class="equipos">${['A', 'B'].map((t) => `<div class="equipo ${t}"><h3>${esc(S.teams[t].name)}</h3><ul>${lista(t)}</ul></div>`).join('')}</div>
      </div></div>`;
  } else if (S.intro) {
    const extra = S.intro.prueba === 'rueda'
      ? `<div class="equipos" style="max-width:90vmin;margin:5vmin auto 0">${['A', 'B'].map((t) => `<div class="equipo ${t}" style="min-height:0;text-align:center"><h3>${esc(S.teams[t].name)}</h3><div class="big">${S.tiempoBase + S.teams[t].bonus} s</div></div>`).join('')}</div>` : '';
    const ICONOS = { quiz: '⚡', vf: '✅', antes: '⏳', anagrama: '🔀', siglas: '🔤', oculta: '🕵️', cifra: '🔢', quiensoy: '🎭', adivinanza: '🧩', refran: '💬', rueda: '🎡' };
    h = `<div style="text-align:center"><div class="intro-icono">${ICONOS[S.intro.prueba] || '🎲'}</div><div class="big intro-titulo">${esc(S.intro.titulo)}</div><div class="sub intro-texto">${esc(S.intro.texto)}</div>${extra}
      <div class="sub intro-cuenta" style="font-size:2.4vmin">Empieza en ${seg(S.rem)}…</div></div>`;
  } else if (S.phase === 'quiz' && S.modo === 'presentador' && S.quiz.stage === 'ask') {
    const q = S.quiz;
    const aviso = q.buzz ? `<span class="${q.buzz.team}" style="color:var(--team)">🔔 ¡${esc(S.teams[q.buzz.team].name)} responde!</span>` : q.espera > 0 ? `<span style="color:var(--muted)">🤔 Piensen… el botón se activa en ${seg(q.espera)}</span>` : '¡Ya pueden presionar «¡Lo sé!»!';
    h = `<div class="q"><div class="pista">Pregunta ${q.n} de ${q.total}</div>
      <div class="qtxt">${esc(q.texto)}</div>
      <div class="opts">${q.opciones.map((o, k) => `<div class="opt o${k}"><span class="k">${LETRAS_OPC[k]}</span><span style="flex:1">${esc(o)}</span></div>`).join('')}</div>
      <div class="aviso" style="margin-top:3vmin">${aviso}</div>
      <div class="estado">${['A', 'B'].map((t) => `<span class="chip ${t} ${q.bloqueado[t] ? '' : 'on'}">${esc(S.teams[t].name)}${q.bloqueado[t] ? ' · falló' : ''}</span>`).join('')}</div></div>`;
  } else if (S.phase === 'quiz') {
    const q = S.quiz, rev = q.stage === 'reveal';
    const quien = (k) => rev ? ['A', 'B'].filter((t) => q.resp[t] && q.resp[t].opt === k).map((t) => `<span class="chip ${t}" style="font-size:2.4vmin">${esc(S.teams[t].name)}</span>`).join(' ') : '';
    h = `<div class="q"><div class="pista">Pregunta ${q.n} de ${q.total}</div>
      <div class="qtxt">${esc(q.texto)}</div>
      <div class="opts">${q.opciones.map((o, k) => `<div class="opt o${k} ${rev ? (k === q.correcta ? 'win' : 'dim') : ''}"><span class="k">${LETRAS_OPC[k]}</span><span style="flex:1">${esc(o)}</span>${quien(k)}</div>`).join('')}</div>
      ${rev ? `<div class="estado">${['A', 'B'].map((t) => `<span class="chip ${t} on">${esc(S.teams[t].name)}: ${q.gana[t] ? '+' + q.gana[t] + ' s' : '—'}</span>`).join('')}</div>`
            : `<div class="bar"><i style="width:${(q.rem / 150).toFixed(1)}%"></i></div>
               <div class="estado">${['A', 'B'].map((t) => `<span class="chip ${t} ${q.respondido[t] ? 'on' : ''}">${esc(S.teams[t].name)} ${q.respondido[t] ? '✓' : '…'}</span>`).join('')}</div>`}
    </div>`;
  } else if (S.phase === 'oculta') {
    const o = S.oculta;
    let aviso = '';
    if (o.ganador) aviso = `<span class="${o.ganador.team}" style="color:var(--team)">¡${esc(S.teams[o.ganador.team].name)} acierta! +${o.ganador.seg} s</span>`;
    else if (o.stage === 'reveal') aviso = 'Nadie la acertó';
    else if (o.buzz) aviso = `<span class="${o.buzz.team}" style="color:var(--team)">${S.modo === 'presentador' ? '🔔 ¡' + esc(S.teams[o.buzz.team].name) + ' responde!' : esc(S.teams[o.buzz.team].name) + ' responde… ' + seg(o.buzz.rem)}</span>`;
    else if (o.espera > 0) aviso = `<span style="color:var(--muted)">🤔 Piensen… el botón se activa en ${seg(o.espera)}</span>`;
    else if (S.modo === 'presentador' && !o.pista) aviso = '<span style="color:var(--muted)">🎙️ Escuchen la pista</span>';
    else if (o.intento) aviso = `<span style="color:var(--ko)">«${esc(o.intento.texto)}» no es correcta</span>`;
    h = `<div style="width:100%"><div class="pista">Palabra ${o.n} de ${o.total}${o.pista ? ' · ' + esc(o.pista) : ''}</div>
      <div class="tiles">${o.letras.map((ch) => ch === ' ' ? '<div class="tile sp"></div>' : `<div class="tile ${ch ? 'on' : ''}">${esc(ch)}</div>`).join('')}</div>
      <div class="aviso">${aviso}</div>
      <div class="estado">${['A', 'B'].map((t) => `<span class="chip ${t} ${o.bloqueado[t] ? '' : 'on'}">${esc(S.teams[t].name)}${o.bloqueado[t] ? ' · bloqueado' : ''}</span>`).join('')}</div></div>`;
  } else if (S.vf) {
    const v = S.vf, rev = v.stage === 'reveal';
    const chips = rev
      ? ['A', 'B'].map((t) => `<span class="chip ${t} on">${esc(S.teams[t].name)}: ${v.gana[t] ? '+' + v.gana[t] + ' s' : v.resp[t] === null ? 'sin respuesta' : 'falló'}</span>`).join('')
      : ['A', 'B'].map((t) => `<span class="chip ${t} ${v.respondido[t] ? 'on' : ''}">${esc(S.teams[t].name)} ${v.respondido[t] ? '✓' : '…'}</span>`).join('');
    let cuerpo;
    if (v.kind === 'antes') {
      cuerpo = `<div class="qtxt">${esc(v.texto)}</div>
        <div class="opts">${v.opciones.map((o, k) => `<div class="opt o${k + 1} ${rev ? (k === v.correcta ? 'win' : 'dim') : ''}"><span class="k">${'AB'[k]}</span><span style="flex:1">${esc(o)}</span></div>`).join('')}</div>
        ${rev && v.detalle ? `<div class="sub" style="margin-top:2.5vmin">${esc(v.detalle)}</div>` : ''}`;
    } else {
      cuerpo = `<div class="qtxt">${esc(v.texto)}</div>` + (rev ? `<div class="big" style="font-size:9vmin;color:${v.correcta === 0 ? 'var(--ok)' : 'var(--ko)'}">${v.correcta === 0 ? 'VERDADERO' : 'FALSO'}</div>` : '');
    }
    h = `<div class="q"><div class="pista">${esc(v.titulo)} · ${v.n} de ${v.total}</div>${cuerpo}
      ${rev ? '' : `<div class="bar"><i style="width:${(100 * v.rem / v.total_ms).toFixed(1)}%"></i></div>`}
      <div class="estado">${chips}</div></div>`;
  } else if (S.phase === 'cifra') {
    const c = S.cifra, rev = c.stage === 'reveal';
    const num = (x) => (c.unidad ? Number(x).toLocaleString('es-CL') : String(x)); // años sin punto de miles
    const chips = ['A', 'B'].map((t) => rev
      ? `<span class="chip ${t} on">${esc(S.teams[t].name)}: ${c.resp[t] === null ? 'sin respuesta' : num(c.resp[t])}${c.gana[t] ? ' · +' + c.gana[t] + ' s' : ''}</span>`
      : `<span class="chip ${t} ${c.respondido[t] ? 'on' : ''}">${esc(S.teams[t].name)} ${c.respondido[t] ? '✓' : '…'}</span>`).join('');
    h = `<div class="q"><div class="pista">Adivina la cifra · ${c.n} de ${c.total}</div>
      <div class="qtxt">${esc(c.texto)}</div>
      ${rev ? `<div class="big" style="font-size:12vmin;color:var(--ok)">${num(c.respuesta)} <span style="font-size:4vmin">${esc(c.unidad)}</span></div>`
            : '<div class="sub">Escriban su número en el celular</div>'}
      <div class="estado" style="margin-top:3vmin">${chips}</div></div>`;
  } else if (S.p && ['anagrama', 'quiensoy', 'refran', 'adivinanza', 'siglas'].includes(S.phase)) {
    const p = S.p, rev = p.stage === 'reveal';
    let aviso = '';
    if (p.ganador) aviso = `<span class="${p.ganador.team}" style="color:var(--team)">¡${esc(S.teams[p.ganador.team].name)} acierta! +${p.ganador.seg} s</span>`;
    else if (rev) aviso = 'Nadie lo acertó';
    else if (p.buzz) aviso = `<span class="${p.buzz.team}" style="color:var(--team)">${S.modo === 'presentador' ? '🔔 ¡' + esc(S.teams[p.buzz.team].name) + ' responde!' : esc(S.teams[p.buzz.team].name) + ' responde… ' + seg(p.buzz.rem)}</span>`;
    else if (p.intento) aviso = `<span style="color:var(--ko)">«${esc(p.intento.texto)}» no es correcto</span>`;
    else if (p.espera > 0) aviso = `<span style="color:var(--muted)">🤔 Piensen… el botón se activa en ${seg(p.espera)}</span>`;
    let cuerpo = '';
    if (p.kind === 'anagrama') {
      const letras = rev ? [...p.respuesta.replace(/\s/g, '')] : [...p.revuelta];
      cuerpo = `${p.pista ? `<div class="sub" style="margin:0 auto">Pista: <b style="color:var(--ink)">${esc(p.pista)}</b></div>` : (rev ? '' : '<div class="sub" style="margin:0 auto">🎙️ Escuchen la pista</div>')}
        <div class="tiles">${letras.map((ch) => `<div class="tile on" style="${rev ? 'background:var(--ok);color:#fff;border-color:var(--ok)' : ''}">${esc(ch)}</div>`).join('')}</div>`;
    } else if (p.kind === 'quiensoy') {
      const dots = [1, 2, 3].map((k) => `<span style="display:inline-block;width:3vmin;height:3vmin;border-radius:50%;margin:0 .6vmin;background:${k <= p.numPistas ? 'var(--B)' : 'var(--pend)'}"></span>`).join('');
      cuerpo = `<div style="text-align:center;margin:2vmin 0">${dots}</div>` + (p.pistas
        ? `<div style="max-width:120vmin;margin:0 auto">${p.pistas.map((t, k) => `<div class="qtxt" style="font-size:4.4vmin;margin:1.5vmin 0;animation:pop .35s">${k + 1}. ${esc(t)}</div>`).join('')}</div>`
        : `<div class="big" style="margin:3vmin 0">🎙️ Escuchen la pista ${p.numPistas} de 3</div>`)
        + (rev ? `<div class="big" style="color:var(--ok);margin-top:2vmin">${esc(p.respuesta.toUpperCase())}</div>` : '');
    } else if (p.kind === 'adivinanza') {
      cuerpo = `<div class="qtxt" style="font-size:5.6vmin;max-width:140vmin;margin:3vmin auto;font-style:italic">«${esc(p.texto)}»</div>`
        + (rev ? `<div class="big" style="color:var(--ok)">${esc(p.respuesta.toUpperCase())}</div>` : '');
    } else if (p.kind === 'siglas') {
      cuerpo = `<div class="tiles">${[...p.sigla].map((ch) => `<div class="tile on" style="width:13vmin;height:15vmin;font-size:10vmin">${esc(ch)}</div>`).join('')}</div>`
        + (rev ? `<div class="qtxt" style="color:var(--ok)">${esc((t => t.charAt(0).toUpperCase() + t.slice(1))(p.respuesta.split(': ').slice(1).join(': ')))}</div>` : '');
    } else {
      cuerpo = rev ? `<div class="qtxt" style="max-width:140vmin;margin:3vmin auto">${esc(p.respuesta)}</div>`
        : p.inicio ? `<div class="qtxt" style="font-size:7vmin;margin:3vmin 0">${esc(p.inicio)}</div>` : '<div class="big" style="margin:3vmin 0">🎙️ Escuchen el refrán</div>';
    }
    h = `<div style="width:100%"><div class="pista">${esc(p.titulo)} · ${p.n} de ${p.total}</div>${cuerpo}
      <div class="aviso">${aviso}</div>
      <div class="estado">${['A', 'B'].map((t) => `<span class="chip ${t} ${p.bloqueado[t] ? '' : 'on'}">${esc(S.teams[t].name)}${p.bloqueado[t] ? ' · bloqueado' : ''}</span>`).join('')}</div></div>`;
  } else if (S.phase === 'rueda') {
    const r = S.rueda, t = r.turno, T = r.eq[t];
    const n = T.letras.length, R = 44;
    const letras = T.letras.map((l, k) => {
      const a = -Math.PI / 2 + (2 * Math.PI * k) / n;
      return `<div id="l-${t}-${k}" class="l ${l.estado} ${k === T.idx && r.stage === 'play' ? 'cur' : ''}" style="--d:${k * 35};left:${50 + R * Math.cos(a)}%;top:${50 + R * Math.sin(a)}%">${l.letra}</div>`;
    }).join('');
    const c = r.actual;
    const centro = c ? `<div class="tipo">${c.tipo === 'empieza' ? 'Empieza por' : 'Contiene la'}</div><div class="letra" id="letra-${t}-${c.letra}" style="font-size:20vmin">${c.letra}</div>`
                     : `<div class="tipo">Turno de</div><div class="def" style="font-size:4vmin;color:var(--team)">${esc(S.teams[t].name)}</div>`;
    const lado = (x) => {
      const E = r.eq[x], ac = E.letras.filter((l) => l.estado === 'acierto').length, fa = E.letras.filter((l) => l.estado === 'fallo').length;
      return `<div class="lado ${x} ${x === t ? 'on' : ''}"><div class="nom">${esc(S.teams[x].name)}</div><div class="reloj">${seg(E.tiempo)}</div>
        <div class="cnt">✅ ${ac} &nbsp; ❌ ${fa}</div><div class="mini">${E.letras.map((l) => `<b class="${l.estado}">${l.letra}</b>`).join('')}</div></div>`;
    };
    let flash = '';
    const u = r.ultimo;
    if (u && Date.now() < flashHasta) {
      if (u.tipo === 'acierto') flash = `<div class="flash" style="--c:var(--ok)">¡Correcto!</div>`;
      else if (u.tipo === 'fallo') flash = `<div class="flash" style="--c:var(--ko)">Incorrecto<small>Era: ${esc(u.correcta.toUpperCase())}</small></div>`;
      else if (u.tipo === 'paso') flash = `<div class="flash" style="--c:#6366f1">¡Paso!</div>`;
      else if (u.tipo === 'tiempo') flash = `<div class="flash" style="--c:var(--ko)">¡Se acabó el tiempo!</div>`;
    }
    h = `<div class="rueda-wrap">${lado('A')}<div class="rueda ${t}">${letras}<div class="centro">${centro}</div>${flash}</div>${lado('B')}</div>`;
  } else if (S.phase === 'fin') {
    const f = S.fin;
    h = `<div style="text-align:center"><div class="trofeo">🏆</div><div class="big fin-titulo">${f.ganador ? `<span class="${f.ganador}" style="color:var(--team)">¡Gana ${esc(S.teams[f.ganador].name)}!</span>` : '¡Empate!'}</div>
      <div class="equipos" style="max-width:100vmin;margin:5vmin auto 0">${f.res.map((x) => `<div class="equipo ${x.team}" style="min-height:0;text-align:center">
        <h3>${esc(S.teams[x.team].name)}</h3><div class="big">${x.aciertos} ${x.aciertos === 1 ? 'acierto' : 'aciertos'}</div><div class="sub">${x.fallos} ${x.fallos === 1 ? 'fallo' : 'fallos'} · ${seg(x.tiempo)} s restantes</div></div>`).join('')}</div></div>`;
  }
  // cada pantalla lleva una clave: si cambia (otra pregunta, otra prueba, otro turno) se anima su entrada
  const dato = S.quiz || S.vf || S.cifra || S.oculta || S.p;
  const clave = S.phase + '-' + (S.intro ? S.intro.prueba : '') + (dato ? dato.n + (dato.kind || '') : '') + (S.rueda ? S.rueda.turno : '');
  h = `<div class="vista" id="v-${clave.replace(/[^\w-]/g, '')}">${h}</div>`;
  if (S.paused) h += '<div class="pausa">⏸ Pausa</div>';
  // pantalla nueva → se reemplaza entera (y se anima su entrada); misma pantalla → solo se actualiza lo que cambió
  if (clave !== claveAnterior) { m.innerHTML = h; claveAnterior = clave; }
  else Idiomorph.morph(m, h, { morphStyle: 'innerHTML' });
}
setInterval(() => { if (S && S.phase === 'rueda' && flashHasta && Date.now() > flashHasta) { flashHasta = 0; render(); } }, 200);
</script>
</body></html>
